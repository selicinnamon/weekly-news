  <text x="67" y="77" font-family="Georgia,serif" font-size="32" font-weight="bold" fill="#e1ff55">W</text>
  <text x="123" y="76" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#191b16">The Weekly Edit</text>
  <text x="60" y="260" font-family="Georgia,serif" font-size="86" fill="#191b16">The Truth must</text>
  <text x="60" y="362" font-family="Georgia,serif" font-size="86" font-style="italic" fill="#18392c">dazzle gradually.</text>
  <text x="64" y="433" font-family="PingFang SC,Heiti SC,sans-serif" font-size="25" fill="#18392c">真相的光，须徐徐照亮。</text>
  <text x="64" y="485" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#66685e">— Emily Dickinson</text>
